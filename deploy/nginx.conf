# Nginx is the only thing the internet talks to (port 80).
# It serves the React files from disk and forwards /api requests to the Node API,
# which only listens on 127.0.0.1:3000 and can't be reached from outside.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/stagepass;
    index index.html;

    # Every response says which machine sent it. Useful once there's a load balancer in front.
    add_header X-Served-By $hostname always;

    # API requests go to the Node process on the same machine
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS and CSS files have a hash in their name, so browsers can cache them forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a page of the React app, e.g. /events/3 or /tickets
    location / {
        try_files $uri /index.html;
    }
}
